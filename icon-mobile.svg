<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dfa0"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#b89328"/>
    </linearGradient>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060a13"/>
    </linearGradient>
  </defs>
  <!-- Phone Body -->
  <rect x="11" y="4" width="26" height="40" rx="6" fill="url(#bgGradM)" stroke="url(#goldGradM)" stroke-width="2.2"/>
  <!-- Speaker / Notch -->
  <line x1="19" y1="8" x2="29" y2="8" stroke="#e5c158" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Inner Screen Content -->
  <rect x="15" y="12" width="18" height="21" rx="3" fill="rgba(229, 193, 88, 0.12)" stroke="#e5c158" stroke-width="1" stroke-dasharray="2 1"/>
  <!-- App Icon on Screen -->
  <circle cx="24" cy="22.5" r="5" fill="url(#goldGradM)"/>
  <path d="M22 22.5L23.5 24L26 21" stroke="#060a13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Home Indicator / Nav Bar -->
  <line x1="18" y1="38" x2="30" y2="38" stroke="#e5c158" stroke-width="2" stroke-linecap="round"/>
</svg>
