<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dfa0"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#b89328"/>
    </linearGradient>
    <linearGradient id="bgGradW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060a13"/>
    </linearGradient>
  </defs>
  <!-- Browser Window -->
  <rect x="5" y="6" width="38" height="34" rx="5" fill="url(#bgGradW)" stroke="url(#goldGradW)" stroke-width="2.2"/>
  <!-- Header bar -->
  <line x1="5" y1="15" x2="43" y2="15" stroke="#e5c158" stroke-width="1.5"/>
  <!-- Browser dots -->
  <circle cx="10" cy="10.5" r="1.5" fill="#f87171"/>
  <circle cx="15" cy="10.5" r="1.5" fill="#fbbf24"/>
  <circle cx="20" cy="10.5" r="1.5" fill="#34d399"/>
  <!-- Address bar -->
  <rect x="25" y="8.5" width="14" height="4" rx="2" fill="rgba(229, 193, 88, 0.15)"/>
  <!-- Globe / Web symbol inside browser -->
  <circle cx="24" cy="27" r="9" stroke="url(#goldGradW)" stroke-width="1.8" fill="rgba(229, 193, 88, 0.08)"/>
  <ellipse cx="24" cy="27" rx="4.5" ry="9" stroke="url(#goldGradW)" stroke-width="1.4" fill="none"/>
  <line x1="15" y1="27" x2="33" y2="27" stroke="url(#goldGradW)" stroke-width="1.4"/>
</svg>
